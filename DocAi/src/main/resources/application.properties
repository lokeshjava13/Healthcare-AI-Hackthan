
# ===================================
# APPLICATION CONFIGURATION
# ===================================

spring.application.name=DocAi
server.port=1234

# ===================================
# MYSQL DATABASE CONFIGURATION
# ===================================

spring.datasource.url=jdbc:mysql://localhost:3306/docai_db1
spring.datasource.username=root
spring.datasource.password=loki@1213
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# HIBERNATE / JPA CONFIGURATION
# ===================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================
# JWT CONFIGURATION
# ===================================

jwt.secret=DocAiHealthcareManagementJwtSecretKey2026Secure
jwt.expiration=86400000

# ===================================
# OLLAMA AI CONFIGURATION
# ===================================

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:3b
spring.ai.ollama.chat.options.temperature=0.7

# ===================================
# FILE UPLOAD CONFIGURATION
# ===================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================
# LOGGING CONFIGURATION
# ===================================

logging.level.org.springframework.security=INFO
logging.level.com.HealthcareManagement.DocAi=DEBUG
logging.level.org.hibernate.SQL=DEBUG